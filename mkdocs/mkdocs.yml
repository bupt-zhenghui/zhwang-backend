# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Zhenghui's Doc
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Noto Serif SC
    code: Roboto Mono
    size: 12
  palette:
    primary: indigo

  features:
    - content.code.annotate
    - content.code.copy
#    - header.autohide
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tracking
    - toc.integrate
    - navigation.top
    - navigation.footer
    - blog  # 基础博客功能（必须）
    - blog.tags  # 文章内显示标签及筛选
    - blog.tags.index  # 生成全局标签索引页
    - navigation.tabs  # 可选：标签页导航（便于访问标签页）

markdown_extensions:
  - attr_list
  - md_in_html
  - abbr
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - pymdownx.mark
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: http://zhwang.site
  - About: index.md
  - Research:
      - Thesis: thesis.md
  - Engineering:
      - engineering/index.md
  - AI:
      - ai/index.md
  - CS Basics:
      - cs-basics/index.md
  - Blog:
      - blog/index.md

plugins:
  - blog:
      blog_dir: blog
  - blog:
      blog_dir: engineering
  - blog:
      blog_dir: ai
  - blog:
      blog_dir: cs-basics
  - tags
  - search
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags